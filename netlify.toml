# Static one-file portfolio: index.html + favicon/PWA assets + images/js/fonts
# at the repo root. There is NO build step.
#
# `command` is an explicit no-op so it overrides any old "npm run build" left
# in the Netlify UI. `publish = "."` publishes the repo root as-is (the old
# Create React App published to "build/", which no longer exists).
[build]
  command = "echo no build step"
  publish = "."
